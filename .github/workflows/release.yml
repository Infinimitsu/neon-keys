# Builds the Windows zip, Debian package and Linux tarball when a version tag (v1.2.3) is pushed,
# and publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION ($version)" >&2
            exit 1
          fi

      - name: Build
        run: scripts/build-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Neon Keys ${GITHUB_REF_NAME#v}" --generate-notes
